# Copyright (C) 2025-2026 KasSigner Project (kassigner@proton.me)
# License: GPL-3.0
#
# Pure Rust → WASM. Zero C dependencies. No ring, no rustls, no tokio.
# Browser provides WebSocket (TLS handled natively) and crypto.getRandomValues.

[package]
name = "kassee-web"
version = "1.0.4"
edition = "2021"
description = "KasSee Web — browser-based watch-only wallet for air-gapped KasSigner"
license = "GPL-3.0-only"
repository = "https://github.com/InKasWeRust/KasSigner"
keywords = ["kaspa", "wallet", "wasm", "covenant", "watch-only"]
categories = ["cryptography::cryptocurrencies", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "ErrorEvent",
    "CloseEvent",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# Borsh for Kaspa wRPC protocol
borsh = { version = "1", features = ["derive"] }

# Pure Rust crypto (no C, no ring)
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
sha2 = "0.10"
hmac = "0.12"
ripemd = "0.1"

# Base58 for kpub decoding
bs58 = { version = "0.5", features = ["check"] }

# Blake2b for Kaspa hashing
blake2b_simd = "1"

# Blake3 for KCC20 oracle message hashing (matches engine OpBlake3). Pure Rust for wasm.
blake3 = { version = "1", default-features = false }

# QR generation (pure Rust)
qrcode = "0.14"

# Hex encoding
hex = "0.4"

# Better panic messages in browser console
console_error_panic_hook = "0.1"

# getrandom for WASM
getrandom = { version = "0.2", features = ["js"] }

# Arkworks ZK — Groth16 prover over BN254. Versions are pinned to the exact
# Arkworks release used by rusty-kaspa's workspace.
# Keep Arkworks' optional tracing/std layer disabled. KasSee's WASM runtime has
# allocation support, while the crypto crates themselves operate without that
# logging layer; disabling it also removes the vulnerable tracing-subscriber
# 0.2 dependency chain (RUSTSEC-2025-0055).
ark-ff = { version = "=0.6.0", default-features = false }
ark-ec = { version = "=0.6.0", default-features = false }
ark-bn254 = { version = "=0.6.0", default-features = false, features = ["curve"] }
ark-groth16 = { version = "=0.6.0", default-features = false }
ark-relations = { version = "=0.6.0", default-features = false }
ark-serialize = { version = "=0.6.0", default-features = false }
ark-std = { version = "=0.6.0", default-features = false }
ark-snark = { version = "=0.6.0", default-features = false }
ark-r1cs-std = { version = "=0.6.0", default-features = false }
ark-crypto-primitives = { version = "=0.6.0", default-features = false, features = ["snark", "crh"] }

[profile.release]
opt-level = "s"
lto = true
